<header class="topbar">
    <div class="topbar-left">
        <button type="button" class="btn-drawer-toggle" id="btnOpenSidebar" aria-label="Buka menu navigasi" aria-expanded="false" aria-controls="appSidebar">
            <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>

        <nav class="breadcrumb-nav" aria-label="Breadcrumb">
            <ol class="breadcrumb-list">
                <li class="breadcrumb-item-custom">
                    <a href="{{ url_for('home') }}"><i class="fa-solid fa-house me-1" aria-hidden="true"></i>Beranda</a>
                </li>
                {% if breadcrumb_title %}
                <li class="breadcrumb-separator" aria-hidden="true">
                    <i class="fa-solid fa-chevron-right"></i>
                </li>
                <li class="breadcrumb-item-custom active" aria-current="page">
                    {{ breadcrumb_title }}
                </li>
                {% endif %}
            </ol>
        </nav>
    </div>

    <div class="topbar-right">
        <button type="button" class="search-trigger-btn" id="btnOpenSearch" aria-label="Cari fitur, metrik, atau halaman (Ctrl+K)">
            <span class="d-flex align-items-center gap-2">
                <i class="fa-solid fa-magnifying-glass text-gold" aria-hidden="true"></i>
                <span class="search-trigger-text">Cari fitur, metrik, halaman...</span>
            </span>
            <kbd class="search-kbd">Ctrl+K</kbd>
        </button>

        <div class="sync-pill" title="Waktu sinkronisasi data pasar terakhir">
            <span class="sync-dot" aria-hidden="true"></span>
            <span class="sync-pill-label">Sinkronisasi:</span>
            <span id="timeSync">--:-- WIB</span>
        </div>
    </div>
</header>
