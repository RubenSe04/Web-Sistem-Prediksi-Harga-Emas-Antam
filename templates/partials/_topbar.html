<header class="topbar">
    <div class="topbar-left">
        <button type="button" class="btn-drawer-toggle" id="btnOpenSidebar" aria-label="Buka menu navigasi" aria-expanded="false" aria-controls="appSidebar">
            <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>

        <nav aria-label="Breadcrumb">
            <ol class="breadcrumb-list">
                <li class="breadcrumb-item-custom">
                    <a href="{{ url_for('home') }}">Beranda</a>
                </li>
                {% if breadcrumb_title %}
                <li class="breadcrumb-separator" aria-hidden="true">/</li>
                <li class="breadcrumb-item-custom active" aria-current="page">{{ breadcrumb_title }}</li>
                {% endif %}
            </ol>
        </nav>
    </div>

    <div class="topbar-right">
        <button type="button" class="search-trigger-btn" id="btnOpenSearch" aria-label="Pencarian Cepat (Ctrl+K)">
            <i class="fa-solid fa-magnifying-glass text-gold" aria-hidden="true"></i>
            <span class="search-trigger-text">Cari Cepat...</span>
            <kbd class="search-kbd">Ctrl+K</kbd>
        </button>

        <div class="sync-pill">
            <span class="sync-dot" aria-hidden="true"></span>
            <span id="timeSync">Sinkronisasi...</span>
        </div>
    </div>
</header>
